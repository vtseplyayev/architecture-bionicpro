server {
    listen 3000;
    server_name localhost;
    
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
    
    # CORS здесь не нужен: статику SPA забирает тот же origin, а межсайтовые
    # запросы разрешает Reports API — точечно, только для http://localhost:3000.
    # Раньше стоял Access-Control-Allow-Origin: * (проблема A4 из Задания 1).


    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}